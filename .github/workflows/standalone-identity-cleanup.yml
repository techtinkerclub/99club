name: Clean standalone 99 Club Studio identity

on:
  push:
    paths:
      - ".github/workflows/standalone-identity-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove old public identity
        shell: bash
        run: |
          set -euo pipefail
          find _pages assets/99club tools/99-club -type f \
            \( -name '*.md' -o -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.webmanifest' -o -name '*.svg' \) -print0 |
            xargs -0 sed -i \
              -e 's#https://techtinker\.club/tools/99-club/#https://99studio.uk/tools/99-club/#g' \
              -e 's#techtinker\.club/tools/99-club/#99studio.uk/tools/99-club/#g' \
              -e 's#techtinker\.club#99studio.uk#g' \
              -e 's/Tech Tinker Club/99 Club Studio/g'

          cat >> assets/99club/99club.css <<'EOF'

          /* Standalone 99 Club Studio: hide the legacy Tech Tinker Club support
             integration until a dedicated 99 Club Studio support account exists. */
          #tt99-root .tt99-support-link,
          #tt99-root .tt99-kofi-modal {
            display:none!important;
          }
          EOF

          {
            echo "# Standalone migration identity audit"
            echo
            echo "Remaining legacy identifiers after public rebrand:"
            echo
            grep -RIn --exclude='MIGRATION_IDENTITY_AUDIT.md' \
              "Tech Tinker Club\|techtinker\.club\|techtinkerclub" \
              _pages assets/99club tools/99-club 2>/dev/null || true
          } > MIGRATION_IDENTITY_AUDIT.md

      - name: Commit identity cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _pages assets/99club tools/99-club MIGRATION_IDENTITY_AUDIT.md
          if git diff --cached --quiet; then
            echo "Nothing to change."
            exit 0
          fi
          git commit -m "Remove Tech Tinker Club identity from standalone site"
          git push
