name: Deduction Audit (temporary)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/99club/deduction-audit.js'
      - 'assets/99club/**'
      - '.github/workflows/deduction-audit-temp.yml'

jobs:
  deduction-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run deduction-solvability audit
        run: DEDUCTION_SAMPLES=5 node scripts/99club/deduction-audit.js
