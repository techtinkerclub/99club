name: 99 Club QA

on:
  push:
    branches: [main]
    paths:
      - 'assets/99club/**'
      - '_pages/99-club-games*.md'
      - '_pages/99-club-practice.md'
      - '_pages/99-club-schools.md'
      - '_pages/privacy.md'
      - 'index.md'
      - 'scripts/99club/**'
      - '.github/workflows/99club-qa.yml'
  pull_request:
    paths:
      - 'assets/99club/**'
      - '_pages/99-club-games*.md'
      - '_pages/99-club-practice.md'
      - '_pages/99-club-schools.md'
      - '_pages/privacy.md'
      - 'index.md'
      - 'scripts/99club/**'
      - '.github/workflows/99club-qa.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      samples:
        description: 'Samples per engine difficulty'
        required: false
        default: '20'

permissions:
  contents: read

concurrency:
  group: 99club-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-contract-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 99 Club QA
        env:
          QA_SAMPLES: ${{ github.event_name == 'schedule' && '60' || github.event.inputs.samples || '20' }}
        run: node scripts/99club/qa.js
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 99club-qa-report
          path: 99club-qa-report.json
          if-no-files-found: ignore

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser harness
        run: node scripts/99club/browser-qa.js prepare
      - name: Exercise online games at phone and desktop widths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/99club-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --virtual-time-budget=120000 --dump-dom \
            http://127.0.0.1:8765/99club-browser-qa.html > /tmp/99club-browser-phone.html
          node scripts/99club/browser-qa.js check /tmp/99club-browser-phone.html
          cp 99club-browser-qa-report.json 99club-browser-qa-phone-report.json

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1200,900 --virtual-time-budget=120000 --dump-dom \
            http://127.0.0.1:8765/99club-browser-qa.html > /tmp/99club-browser-desktop.html
          node scripts/99club/browser-qa.js check /tmp/99club-browser-desktop.html
          cp 99club-browser-qa-report.json 99club-browser-qa-desktop-report.json
      - name: Exercise parent practice download flow
        shell: bash
        run: |
          set -euo pipefail
          node scripts/99club/parent-practice-browser-qa.js prepare
          python3 -m http.server 8767 --bind 127.0.0.1 > /tmp/99club-parent-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi
          TARGET="$(cat 99club-parent-practice-qa-url.txt)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --virtual-time-budget=30000 --dump-dom \
            "http://127.0.0.1:8767${TARGET}" > /tmp/99club-parent-practice.html
          node scripts/99club/parent-practice-browser-qa.js check /tmp/99club-parent-practice.html

      - name: Compare runtime catalogue with help guides
        run: node scripts/99club/help-coverage.js
      - name: Prepare printable preview harness
        run: node scripts/99club/preview-qa.js prepare
      - name: Exercise full printable catalogue at phone width
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/99club-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi
          for BATCH in 0 1; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size=390,844 --virtual-time-budget=180000 --dump-dom \
              "http://127.0.0.1:8766/99club-preview-qa.html?batch=$BATCH" > "/tmp/99club-preview-phone-$BATCH.html"
            node scripts/99club/preview-qa.js check "/tmp/99club-preview-phone-$BATCH.html"
            cp 99club-preview-qa-report.json "99club-preview-qa-batch-$BATCH-report.json"
          done
      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 99club-browser-qa-report
          path: |
            99club-browser-qa-report.json
            99club-browser-qa-phone-report.json
            99club-browser-qa-desktop-report.json
            99club-parent-practice-qa-report.json
            99club-preview-qa-report.json
            99club-preview-qa-batch-0-report.json
            99club-preview-qa-batch-1-report.json
          if-no-files-found: ignore
