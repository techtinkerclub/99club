name: 99 Club QA

on:
  push:
    branches: [main]
    paths:
      - 'assets/99club/**'
      - '_includes/**'
      - '_layouts/**'
      - '_config.yml'
      - 'CNAME'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'offline.html'
      - 'Gemfile'
      - 'package.json'
      - 'package-lock.json'
      - '_pages/99-club-games*.md'
      - '_pages/99-club-practice.md'
      - '_pages/99-club-puzzle-practice.md'
      - '_layouts/practice.html'
      - '_layouts/puzzle-practice.html'
      - '_pages/99-club-schools.md'
      - '_pages/99-club-widget*.md'
      - '_pages/99-club-widget*.html'
      - '_pages/radford-semele-99studio-demo*.html'
      - 'assets/99club/school-demo.*'
      - '_pages/privacy.md'
      - 'index.md'
      - 'scripts/99club/**'
      - '.github/workflows/99club-qa.yml'
  pull_request:
    paths:
      - 'assets/99club/**'
      - '_includes/**'
      - '_layouts/**'
      - '_config.yml'
      - 'CNAME'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'offline.html'
      - 'Gemfile'
      - 'package.json'
      - 'package-lock.json'
      - '_pages/99-club-games*.md'
      - '_pages/99-club-practice.md'
      - '_pages/99-club-puzzle-practice.md'
      - '_layouts/practice.html'
      - '_layouts/puzzle-practice.html'
      - '_pages/99-club-schools.md'
      - '_pages/99-club-widget*.md'
      - '_pages/99-club-widget*.html'
      - '_pages/radford-semele-99studio-demo*.html'
      - 'assets/99club/school-demo.*'
      - '_pages/privacy.md'
      - 'index.md'
      - 'scripts/99club/**'
      - '.github/workflows/99club-qa.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      samples:
        description: 'Samples per engine difficulty'
        required: false
        default: '20'

permissions:
  contents: read

concurrency:
  group: 99club-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-contract-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 99 Club QA
        env:
          QA_SAMPLES: ${{ github.event_name == 'schedule' && '60' || github.event.inputs.samples || '20' }}
        run: node scripts/99club/qa.js
      - name: Run Alphametics catalogue regression
        run: node assets/99club/tests/games-v141-alphametics-smoke.js
      - name: Run Verbal Reasoning regression
        run: node scripts/99club/verbal-reasoning-qa.js
      - name: Run Custom Worksheet expansion QA
        run: node scripts/99club/custom-expansion-qa.js
      - name: Run Games public UI contracts
        run: node scripts/99club/games-public-ui-qa.js
      - name: Run school widget QA
        run: node scripts/99club/widget-qa.js
      - name: Run security and privacy regression checks
        run: node scripts/99club/security-smoke.js
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 99club-qa-report
          path: |
            99club-qa-report.json
            99club-custom-expansion-qa-report.json
            99club-verbal-reasoning-qa-report.json
          if-no-files-found: ignore

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser harness
        run: node scripts/99club/browser-qa.js prepare
      - name: Exercise online games at phone and desktop widths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/99club-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --virtual-time-budget=120000 --dump-dom \
            http://127.0.0.1:8765/99club-browser-qa.html > /tmp/99club-browser-phone.html
          node scripts/99club/browser-qa.js check /tmp/99club-browser-phone.html
          cp 99club-browser-qa-report.json 99club-browser-qa-phone-report.json

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1200,900 --virtual-time-budget=120000 --dump-dom \
            http://127.0.0.1:8765/99club-browser-qa.html > /tmp/99club-browser-desktop.html
          node scripts/99club/browser-qa.js check /tmp/99club-browser-desktop.html
          cp 99club-browser-qa-report.json 99club-browser-qa-desktop-report.json
      - name: Exercise parent practice download flow
        shell: bash
        run: |
          set -euo pipefail
          node scripts/99club/parent-practice-browser-qa.js prepare
          python3 -m http.server 8767 --bind 127.0.0.1 > /tmp/99club-parent-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi
          TARGET="$(cat 99club-parent-practice-qa-url.txt)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --virtual-time-budget=30000 --dump-dom \
            "http://127.0.0.1:8767${TARGET}" > /tmp/99club-parent-practice.html
          node scripts/99club/parent-practice-browser-qa.js check /tmp/99club-parent-practice.html

      - name: Exercise puzzle parent practice download flow
        shell: bash
        run: |
          set -euo pipefail
          node scripts/99club/puzzle-parent-practice-browser-qa.js prepare
          python3 -m http.server 8768 --bind 127.0.0.1 > /tmp/99club-puzzle-parent-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi
          TARGET="$(cat 99club-puzzle-parent-practice-qa-url.txt)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --virtual-time-budget=45000 --dump-dom \
            "http://127.0.0.1:8768${TARGET}" > /tmp/99club-puzzle-parent-practice.html
          node scripts/99club/puzzle-parent-practice-browser-qa.js check /tmp/99club-puzzle-parent-practice.html

      - name: Compare runtime catalogue with help guides
        run: node scripts/99club/help-coverage.js
      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 99club-browser-qa-report
          path: |
            99club-browser-qa-report.json
            99club-browser-qa-phone-report.json
            99club-browser-qa-desktop-report.json
            99club-parent-practice-qa-report.json
            99club-puzzle-parent-practice-qa-report.json
          if-no-files-found: ignore

  printable-catalogue-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare printable preview harness
        run: node scripts/99club/preview-qa.js prepare
      - name: Exercise printable catalogue batch ${{ matrix.batch }} at phone width
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/99club-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi
          BATCH="${{ matrix.batch }}"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --virtual-time-budget=180000 --dump-dom \
            "http://127.0.0.1:8766/99club-preview-qa.html?batch=$BATCH&batches=8" > "/tmp/99club-preview-phone-$BATCH.html"
          node scripts/99club/preview-qa.js check "/tmp/99club-preview-phone-$BATCH.html"
          cp 99club-preview-qa-report.json "99club-preview-qa-batch-$BATCH-report.json"
      - name: Upload printable QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 99club-preview-qa-batch-${{ matrix.batch }}
          path: |
            99club-preview-qa-report.json
            99club-preview-qa-batch-${{ matrix.batch }}-report.json
          if-no-files-found: ignore


  custom-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Custom Worksheet visual harness
        run: node scripts/99club/custom-visual-browser-qa.js prepare
      - name: Exercise new Custom Worksheet families
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8770 --bind 127.0.0.1 > /tmp/99club-custom-visual-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1200,900 --virtual-time-budget=90000 --dump-dom \
            http://127.0.0.1:8770/99club-custom-visual-qa.html > /tmp/99club-custom-visual.html
          node scripts/99club/custom-visual-browser-qa.js check /tmp/99club-custom-visual.html
      - name: Upload Custom visual QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 99club-custom-visual-qa
          path: 99club-custom-visual-qa-report.json
          if-no-files-found: ignore

  preview-controls-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare printable preview harness
        run: node scripts/99club/preview-qa.js prepare
      - name: Exercise printable preview controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/99club-preview-controls-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --virtual-time-budget=60000 --dump-dom \
            "http://127.0.0.1:8769/99club-preview-qa.html?functional=1" > /tmp/99club-preview-controls.html
          node scripts/99club/preview-qa.js check /tmp/99club-preview-controls.html
          cp 99club-preview-qa-report.json 99club-preview-controls-report.json
      - name: Upload preview controls QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 99club-preview-controls-qa
          path: |
            99club-preview-qa-report.json
            99club-preview-controls-report.json
          if-no-files-found: ignore
