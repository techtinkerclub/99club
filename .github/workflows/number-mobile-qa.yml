name: Number Mobile QA

on:
  pull_request:
    paths:
      - 'assets/99club/goodies-number-mobile-balance-v3.js'
      - 'assets/99club/goodies-number-mobile-balance-v3.css'
      - 'assets/99club/goodies-number-mobile-balance-v4.js'
      - 'assets/99club/goodies-number-mobile-balance-v4.css'
      - 'assets/99club/goodies-number-mobile-balance-v5.css'
      - 'assets/99club/goodies-number-mobile-balance-v5-embed.js'
      - 'assets/99club/goodies-number-mobile-balance-v6.js'
      - 'assets/99club/goodies-number-mobile-balance-v6-blank-bridge.js'
      - 'assets/99club/goodies-number-mobile-balance-v7.js'
      - 'assets/99club/goodies-number-mobile-balance-v7.css'
      - '_pages/99-club-goodies.md'
      - '_pages/whiteboard.md'
      - 'scripts/99club/number-mobile-browser-qa.js'
      - 'scripts/99club/goodies-number-mobile-challenge-ux-browser-qa.js'
      - '.github/workflows/number-mobile-qa.yml'
  push:
    branches: [main]
    paths:
      - 'assets/99club/goodies-number-mobile-balance-v3.js'
      - 'assets/99club/goodies-number-mobile-balance-v3.css'
      - 'assets/99club/goodies-number-mobile-balance-v4.js'
      - 'assets/99club/goodies-number-mobile-balance-v4.css'
      - 'assets/99club/goodies-number-mobile-balance-v5.css'
      - 'assets/99club/goodies-number-mobile-balance-v5-embed.js'
      - 'assets/99club/goodies-number-mobile-balance-v6.js'
      - 'assets/99club/goodies-number-mobile-balance-v6-blank-bridge.js'
      - 'assets/99club/goodies-number-mobile-balance-v7.js'
      - 'assets/99club/goodies-number-mobile-balance-v7.css'
      - '_pages/99-club-goodies.md'
      - '_pages/whiteboard.md'
      - 'scripts/99club/number-mobile-browser-qa.js'
      - 'scripts/99club/goodies-number-mobile-challenge-ux-browser-qa.js'
      - '.github/workflows/number-mobile-qa.yml'

permissions:
  contents: read

jobs:
  number-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Number Mobile adapters
        run: |
          node --check assets/99club/goodies-number-mobile-balance-v3.js
          node --check assets/99club/goodies-number-mobile-balance-v4.js
          node --check assets/99club/goodies-number-mobile-balance-v6.js
          node --check assets/99club/goodies-number-mobile-balance-v6-blank-bridge.js
          node --check assets/99club/goodies-number-mobile-balance-v7.js
          node --check assets/99club/goodies-number-mobile-balance-v5-embed.js
          node --check scripts/99club/goodies-number-mobile-challenge-ux-browser-qa.js
      - name: Prepare Number Mobile browser harnesses
        run: |
          node scripts/99club/number-mobile-browser-qa.js prepare
          node scripts/99club/goodies-number-mobile-challenge-ux-browser-qa.js prepare
      - name: Exercise Number Mobile challenges and mixed-whiteboard actions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8781 --bind 127.0.0.1 > /tmp/99club-number-mobile-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable is available on this runner.' >&2
            exit 1
          fi
          timeout 50s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1200,900 --virtual-time-budget=24000 --dump-dom \
            http://127.0.0.1:8781/99club-number-mobile-qa.html > /tmp/99club-number-mobile.html
          cp /tmp/99club-number-mobile.html 99club-number-mobile-debug.html
          node scripts/99club/number-mobile-browser-qa.js check /tmp/99club-number-mobile.html standalone

          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1400,1000 --virtual-time-budget=18000 --dump-dom \
            http://127.0.0.1:8781/99club-number-mobile-board-qa.html > /tmp/99club-number-mobile-board.html
          cp /tmp/99club-number-mobile-board.html 99club-number-mobile-board-debug.html
          node scripts/99club/number-mobile-browser-qa.js check /tmp/99club-number-mobile-board.html board

          timeout 50s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1200,900 --virtual-time-budget=26000 --dump-dom \
            http://127.0.0.1:8781/99club-number-mobile-challenge-ux-qa.html > /tmp/99club-number-mobile-challenge-ux.html
          cp /tmp/99club-number-mobile-challenge-ux.html 99club-number-mobile-challenge-ux-debug.html
          node scripts/99club/goodies-number-mobile-challenge-ux-browser-qa.js check /tmp/99club-number-mobile-challenge-ux.html
      - name: Upload Number Mobile QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: number-mobile-qa-report
          path: |
            99club-number-mobile-qa-report.json
            99club-number-mobile-board-qa-report.json
            99club-number-mobile-challenge-ux-qa-report.json
            99club-number-mobile-debug.html
            99club-number-mobile-board-debug.html
            99club-number-mobile-challenge-ux-debug.html
          if-no-files-found: ignore
