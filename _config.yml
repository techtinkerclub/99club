title: "99 Club Studio"
name: "99 Club Studio"
locale: "en-GB"
title_separator: "·"
og_image: "/assets/99club/images/99studio-social-preview.png"
masthead_title: "99 Club Studio"
description: "Free printable primary maths worksheets, classroom games and online number puzzles."
baseurl: ""
url: "https://99studio.uk"
repository: techtinkerclub/99club

social:
  type: Organization
  name: "99 Club Studio"

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "contrast"

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap

include:
  - "_pages"

# Keep maintainer/QA material in the repository, but never copy it to the public site.
exclude:
  - .github
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docs
  - scripts
  - README.md
  - MIGRATION_IDENTITY_AUDIT.md
  - package.json
  - package-lock.json

header:
  nav: true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: false
      sitemap: false
markdown: kramdown
