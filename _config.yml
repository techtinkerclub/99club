title: "99 Club Studio"
masthead_title: "99 Club Studio"
description: "Free classroom maths worksheets, games and puzzle tools."
baseurl: ""
url: "https://99studio.uk"
repository: techtinkerclub/99club

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "contrast"

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap

include:
  - "_pages"

header:
  nav: true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: false
markdown: kramdown
